[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--ignore=tests/freecad"

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = [
    "F",  # pyflakes
    "E4", "E7", "E9", "E501",  # pycodestyle: import/statement/syntax errors, line length
    "I",  # isort
    "UP",  # pyupgrade
    "B",  # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM",  # flake8-simplify
    "RUF",  # Ruff-specific rules
    "PLR",  # Pylint refactor
]
ignore = [
    "SIM108",  # ternary rewrite hurts readability
    "SIM116",  # dict lookup trades a branch for indirection
    # RUF codes excluded from ruff's own default rule set; not adopted
    "RUF005", "RUF006", "RUF021", "RUF036", "RUF037", "RUF043",
    "RUF060", "RUF061", "RUF064", "RUF102", "RUF103", "RUF104",
    # PLR complexity and magic-value thresholds are judgment calls
    "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR0917", "PLR1714",
    "PLR2004", "PLR5501",
]
